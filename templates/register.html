<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - IDS System</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .register-container {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 400px;
      }

      .logo {
        text-align: center;
        margin-bottom: 30px;
      }

      .logo h1 {
        color: #667eea;
        font-size: 28px;
        margin-bottom: 10px;
      }

      .logo p {
        color: #666;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #333;
        font-weight: 500;
      }

      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      .form-group input:focus {
        outline: none;
        border-color: #667eea;
      }

      .form-group small {
        display: block;
        margin-top: 5px;
        color: #666;
        font-size: 12px;
      }

      .btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .alert {
        padding: 12px;
        border-radius: 5px;
        margin-bottom: 20px;
        font-size: 14px;
      }

      .alert-error {
        background: #fee;
        color: #c33;
        border: 1px solid #fcc;
      }

      .alert-success {
        background: #efe;
        color: #3c3;
        border: 1px solid #cfc;
      }

      .divider {
        text-align: center;
        margin: 20px 0;
        color: #999;
      }

      .link {
        text-align: center;
        margin-top: 20px;
      }

      .link a {
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
      }

      .link a:hover {
        text-decoration: underline;
      }

      .password-toggle {
        position: relative;
      }

      .password-toggle input {
        padding-right: 40px;
      }

      .toggle-btn {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #666;
        font-size: 18px;
      }

      .password-strength {
        height: 4px;
        background: #ddd;
        border-radius: 2px;
        margin-top: 5px;
        overflow: hidden;
      }

      .password-strength-bar {
        height: 100%;
        transition: all 0.3s;
        width: 0%;
      }

      .strength-weak {
        background: #f44336;
        width: 33%;
      }
      .strength-medium {
        background: #ff9800;
        width: 66%;
      }
      .strength-strong {
        background: #4caf50;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <div class="logo">
        <h1>🛡️ IDS System</h1>
        <p>Create your account</p>
      </div>

      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/register" id="registerForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            autofocus
            pattern="[a-zA-Z0-9_]{3,20}"
            title="Username must be 3-20 characters (letters, numbers, underscore only)"
          />
          <small>3-20 characters (letters, numbers, underscore only)</small>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-toggle">
            <input
              type="password"
              id="password"
              name="password"
              required
              minlength="6"
            />
            <button
              type="button"
              class="toggle-btn"
              onclick="togglePassword('password')"
            >
              👁️
            </button>
          </div>
          <div class="password-strength">
            <div class="password-strength-bar" id="strengthBar"></div>
          </div>
          <small>Minimum 6 characters</small>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <div class="password-toggle">
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              required
            />
            <button
              type="button"
              class="toggle-btn"
              onclick="togglePassword('confirm_password')"
            >
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn" id="submitBtn">Register</button>
      </form>

      <div class="divider">───── OR ─────</div>

      <div class="link">
        Already have an account? <a href="/login">Login here</a>
      </div>
    </div>

    <script>
      function togglePassword(fieldId) {
        const passwordInput = document.getElementById(fieldId);
        const type =
          passwordInput.getAttribute("type") === "password"
            ? "text"
            : "password";
        passwordInput.setAttribute("type", type);
      }

      // Password strength checker
      document
        .getElementById("password")
        .addEventListener("input", function (e) {
          const password = e.target.value;
          const strengthBar = document.getElementById("strengthBar");

          let strength = 0;
          if (password.length >= 6) strength++;
          if (password.length >= 10) strength++;
          if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
          if (/[0-9]/.test(password)) strength++;
          if (/[^a-zA-Z0-9]/.test(password)) strength++;

          strengthBar.className = "password-strength-bar";
          if (strength <= 2) {
            strengthBar.classList.add("strength-weak");
          } else if (strength <= 3) {
            strengthBar.classList.add("strength-medium");
          } else {
            strengthBar.classList.add("strength-strong");
          }
        });

      // Form validation
      document
        .getElementById("registerForm")
        .addEventListener("submit", function (e) {
          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirm_password").value;

          if (password !== confirmPassword) {
            e.preventDefault();
            alert("Passwords do not match!");
            return false;
          }

          if (password.length < 6) {
            e.preventDefault();
            alert("Password must be at least 6 characters long!");
            return false;
          }
        });
    </script>
  </body>
</html>
