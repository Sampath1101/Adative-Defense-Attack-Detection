<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced IDS - Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      header {
        background: white;
        padding: 20px 30px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        margin-bottom: 30px;
      }

      h1 {
        color: #333;
        font-size: 24px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .status {
        display: inline-block;
        width: 12px;
        height: 12px;
        background: #4caf50;
        border-radius: 50%;
        animation: pulse 2s infinite;
        flex-shrink: 0;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* ── STAT CARDS ── */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
      }

      .stat-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .stat-card h3 {
        color: #666;
        font-size: 13px;
        font-weight: normal;
        margin-bottom: 8px;
      }

      .stat-value {
        font-size: 32px;
        font-weight: bold;
        color: #333;
      }

      .severity-high {
        color: #f44336;
      }
      .severity-medium {
        color: #ff9800;
      }
      .severity-low {
        color: #ffc107;
      }

      /* ── CHART GRID ── */
      .charts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }

      .chart-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .chart-card h2 {
        color: #333;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 12px;
      }

      /* FIX: every chart wrapper has a fixed height */
      .chart-wrapper {
        position: relative;
        width: 100%;
        height: 200px; /* fixed — prevents infinite growth */
        overflow: hidden;
      }

      /* ── ALERTS SECTION ── */
      .alerts-section {
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .alerts-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 10px;
      }

      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      select {
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
      }

      .alert-list {
        max-height: 500px;
        overflow-y: auto;
      }

      .alert-item {
        border: 1px solid #e0e0e0;
        border-radius: 5px;
        padding: 14px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .alert-item:hover {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        transform: translateY(-1px);
      }

      .alert-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
        gap: 6px;
      }

      .alert-severity {
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: bold;
        color: white;
      }

      .severity-high-bg {
        background: #f44336;
      }
      .severity-medium-bg {
        background: #ff9800;
      }
      .severity-low-bg {
        background: #ffc107;
      }

      .alert-details {
        font-size: 13px;
        color: #555;
        margin-top: 4px;
      }

      .alert-reasons {
        margin-top: 8px;
        padding-left: 18px;
        font-size: 12px;
        color: #666;
      }

      .alert-reasons li {
        margin: 3px 0;
      }

      .refresh-btn {
        background: #667eea;
        color: white;
        border: none;
        padding: 9px 18px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
      }

      .refresh-btn:hover {
        background: #5568d3;
      }

      .loading {
        text-align: center;
        padding: 30px;
        color: #999;
      }
      .error {
        text-align: center;
        padding: 20px;
        color: #f44336;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- HEADER -->
      <header>
        <h1>
          <span class="status"></span>
          ADAPTIVE DEFENCE ATTACK DETECTION
        </h1>
        <p style="color: #666; margin-top: 8px; font-size: 14px">
          Real-time Intrusion Detection System
        </p>
      </header>

      <!-- STAT CARDS -->
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Alerts</h3>
          <div class="stat-value" id="totalAlerts">—</div>
        </div>
        <div class="stat-card">
          <h3>High Severity</h3>
          <div class="stat-value severity-high" id="highAlerts">—</div>
        </div>
        <div class="stat-card">
          <h3>Medium Severity</h3>
          <div class="stat-value severity-medium" id="mediumAlerts">—</div>
        </div>
        <div class="stat-card">
          <h3>Recent (Last Hour)</h3>
          <div class="stat-value" id="recentAlerts">—</div>
        </div>
      </div>

      <!-- CHARTS -->
      <div class="charts-grid">
        <!-- Timeline -->
        <div class="chart-card">
          <h2>Alert Timeline (24 Hours)</h2>
          <div class="chart-wrapper">
            <canvas
              id="timelineChart"
              role="img"
              aria-label="Line chart showing high, medium, and low alerts over the last 24 hours"
            >
            </canvas>
          </div>
        </div>

        <!-- Detection Methods -->
        <div class="chart-card">
          <h2>Detection Methods</h2>
          <div class="chart-wrapper">
            <canvas
              id="methodsChart"
              role="img"
              aria-label="Doughnut chart showing rule-based, ML-based, and hybrid detection counts"
            >
            </canvas>
          </div>
        </div>

        <!-- Top IPs -->
        <div class="chart-card">
          <h2>Top Offending IPs</h2>
          <div class="chart-wrapper">
            <canvas
              id="ipsChart"
              role="img"
              aria-label="Horizontal bar chart showing top offending IP addresses by alert count"
            >
            </canvas>
          </div>
        </div>

        <!-- Severity Distribution -->
        <div class="chart-card">
          <h2>Severity Distribution</h2>
          <div class="chart-wrapper">
            <canvas
              id="severityChart"
              role="img"
              aria-label="Pie chart showing distribution of high, medium, and low severity alerts"
            >
            </canvas>
          </div>
        </div>
      </div>

      <!-- ALERTS TABLE -->
      <div class="alerts-section">
        <div class="alerts-header">
          <h2 style="font-size: 16px">Recent Alerts</h2>
          <div class="filters">
            <select id="severityFilter">
              <option value="">All Severities</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
            <button class="refresh-btn" id="refreshBtn">🔄 Refresh</button>
          </div>
        </div>
        <div class="alert-list" id="alertList">
          <div class="loading">Loading alerts…</div>
        </div>
      </div>
    </div>
    <!-- /container -->

    <script>
      let charts = {};

      /* ─── BOOT ─────────────────────────────────────── */
      document.addEventListener("DOMContentLoaded", () => {
        loadData();
        setInterval(loadData, 30000);

        document
          .getElementById("refreshBtn")
          .addEventListener("click", loadData);

        document
          .getElementById("severityFilter")
          .addEventListener("change", loadAlerts);
      });

      async function loadData() {
        try {
          await Promise.all([
            loadStats(),
            loadTimeline(),
            loadDetectionMethods(),
            loadTopIPs(),
            loadAlerts(),
          ]);
        } catch (err) {
          console.error("loadData error:", err);
        }
      }

      /* ─── HELPERS ───────────────────────────────────── */
      function destroyChart(key) {
        if (charts[key]) {
          charts[key].destroy();
          charts[key] = null;
        }
      }

      function getCtx(id) {
        return document.getElementById(id).getContext("2d");
      }

      /* ─── STATS ─────────────────────────────────────── */
      async function loadStats() {
        const res = await fetch("/api/stats");
        const data = await res.json();
        const a = data.alerts;

        document.getElementById("totalAlerts").textContent =
          a.total_alerts ?? 0;
        document.getElementById("highAlerts").textContent =
          a.by_severity?.high ?? 0;
        document.getElementById("mediumAlerts").textContent =
          a.by_severity?.medium ?? 0;
        document.getElementById("recentAlerts").textContent =
          a.recent_count ?? 0;

        updateSeverityChart(a.by_severity ?? {});
      }

      /* ─── TIMELINE ──────────────────────────────────── */
      async function loadTimeline() {
        try {
          const res = await fetch("/api/timeline?hours=24");
          const data = await res.json();

          if (!data.timeline?.length) {
            console.warn("No timeline data");
            return;
          }

          /* FIX 1: handle both ISO "T" and space separator */
          const labels = data.timeline.map((t) => {
            const s =
              t.label || t.hour.replace("T", " ").split(" ")[1] || t.hour;
            return s.slice(0, 5);
          });

          const high = data.timeline.map((t) => Number(t.high) || 0);
          const medium = data.timeline.map((t) => Number(t.medium) || 0);
          const low = data.timeline.map((t) => Number(t.low) || 0);

          destroyChart("timeline");

          charts.timeline = new Chart(getCtx("timelineChart"), {
            type: "line",
            data: {
              labels,
              datasets: [
                {
                  label: "High",
                  data: high,
                  borderColor: "#f44336",
                  backgroundColor: "rgba(244,67,54,0.08)",
                  borderWidth: 1.5,
                  tension: 0.4,
                  fill: true,
                  pointRadius: 2,
                  pointHoverRadius: 4,
                },
                {
                  label: "Medium",
                  data: medium,
                  borderColor: "#ff9800",
                  backgroundColor: "rgba(255,152,0,0.08)",
                  borderWidth: 1.5,
                  tension: 0.4,
                  fill: true,
                  pointRadius: 2,
                  pointHoverRadius: 4,
                },
                {
                  label: "Low",
                  data: low,
                  borderColor: "#ffc107",
                  backgroundColor: "rgba(255,193,7,0.08)",
                  borderWidth: 1.5,
                  tension: 0.4,
                  fill: true,
                  pointRadius: 2,
                  pointHoverRadius: 4,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false /* FIX 2: must be false */,
              animation: { duration: 400 },
              plugins: {
                legend: {
                  position: "bottom",
                  labels: { boxWidth: 8, padding: 10, font: { size: 10 } },
                },
                tooltip: {
                  mode: "index",
                  intersect: false,
                  callbacks: { title: (items) => `Time: ${items[0].label}` },
                },
              },
              scales: {
                x: {
                  ticks: {
                    autoSkip: true,
                    maxTicksLimit: 8 /* FIX 3: compact x-axis */,
                    maxRotation: 0,
                    font: { size: 9 },
                    color: "#999",
                  },
                  grid: { color: "rgba(0,0,0,0.04)" },
                },
                y: {
                  beginAtZero: true,
                  ticks: {
                    precision: 0,
                    maxTicksLimit: 5,
                    font: { size: 9 },
                    color: "#999",
                  },
                  grid: { color: "rgba(0,0,0,0.04)" },
                },
              },
            },
          });
        } catch (err) {
          console.error("Timeline error:", err);
        }
      }

      /* ─── DETECTION METHODS ─────────────────────────── */
      async function loadDetectionMethods() {
        try {
          const res = await fetch("/api/detection-methods");
          const data = await res.json();

          destroyChart("methods");

          charts.methods = new Chart(getCtx("methodsChart"), {
            type: "doughnut",
            data: {
              labels: ["Rule-based", "ML-based", "Hybrid"],
              datasets: [
                {
                  data: [
                    data.detection_methods?.rule ?? 0,
                    data.detection_methods?.ml ?? 0,
                    data.detection_methods?.hybrid ?? 0,
                  ],
                  backgroundColor: ["#2196F3", "#4CAF50", "#9C27B0"],
                  borderWidth: 2,
                  borderColor: "#fff",
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false /* FIX */,
              cutout: "60%",
              animation: { duration: 400 },
              plugins: {
                legend: {
                  position: "bottom",
                  labels: { boxWidth: 8, padding: 10, font: { size: 10 } },
                },
              },
            },
          });
        } catch (err) {
          console.error("Detection methods error:", err);
        }
      }

      /* ─── TOP IPs ────────────────────────────────────── */
      async function loadTopIPs() {
        try {
          const res = await fetch("/api/top-ips?limit=5");
          const data = await res.json();

          destroyChart("ips");

          charts.ips = new Chart(getCtx("ipsChart"), {
            type: "bar",
            data: {
              labels: data.top_ips.map((ip) => ip.ip),
              datasets: [
                {
                  label: "Alerts",
                  data: data.top_ips.map((ip) => ip.count),
                  backgroundColor: "rgba(244,67,54,0.75)",
                  borderRadius: 3,
                  barThickness: 16,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false /* FIX */,
              indexAxis: "y",
              animation: { duration: 400 },
              plugins: {
                legend: { display: false },
              },
              scales: {
                x: {
                  beginAtZero: true,
                  ticks: {
                    precision: 0,
                    font: { size: 9 },
                    color: "#999",
                    maxTicksLimit: 5,
                  },
                  grid: { color: "rgba(0,0,0,0.04)" },
                },
                y: {
                  ticks: { font: { size: 9 }, color: "#333" },
                  grid: { display: false },
                },
              },
            },
          });
        } catch (err) {
          console.error("Top IPs error:", err);
        }
      }

      /* ─── SEVERITY PIE ───────────────────────────────── */
      function updateSeverityChart(sev) {
        destroyChart("severity");

        charts.severity = new Chart(getCtx("severityChart"), {
          type: "pie",
          data: {
            labels: ["High", "Medium", "Low"],
            datasets: [
              {
                data: [sev.high ?? 0, sev.medium ?? 0, sev.low ?? 0],
                backgroundColor: ["#f44336", "#ff9800", "#ffc107"],
                borderWidth: 2,
                borderColor: "#fff",
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false /* FIX */,
            animation: { duration: 400 },
            plugins: {
              legend: {
                position: "bottom",
                labels: { boxWidth: 8, padding: 10, font: { size: 10 } },
              },
            },
          },
        });
      }

      /* ─── ALERTS LIST ────────────────────────────────── */
      async function loadAlerts() {
        const severity = document.getElementById("severityFilter").value;
        const alertList = document.getElementById("alertList");
        alertList.innerHTML = '<div class="loading">Loading alerts…</div>';

        try {
          const qs = severity ? `&severity=${severity}` : "";
          const res = await fetch(`/api/alerts?limit=50${qs}`);

          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const data = await res.json();

          if (!data.success) throw new Error(data.error || "API error");

          if (!data.alerts?.length) {
            alertList.innerHTML = '<div class="loading">No alerts found</div>';
            return;
          }

          alertList.innerHTML = data.alerts
            .map(
              (alert) => `
            <div class="alert-item">
              <div class="alert-header">
                <span class="alert-severity severity-${alert.severity}-bg">
                  ${alert.severity.toUpperCase()}
                </span>
                <span style="font-size:12px;color:#999;">
                  ${new Date(alert.timestamp).toLocaleString()}
                </span>
              </div>
              <div class="alert-details">
                <strong>IP:</strong> ${alert.ip} &nbsp;|&nbsp;
                <strong>Path:</strong> ${alert.path} &nbsp;|&nbsp;
                <strong>Method:</strong> ${alert.method}
              </div>
              <div class="alert-details">
                <strong>Detection:</strong> ${alert.detection_method}
                (${(alert.confidence * 100).toFixed(1)}% confidence)
              </div>
              <div class="alert-details">
                <strong>Threat:</strong> ${alert.threat_type}
              </div>
              ${
                alert.payload && alert.payload !== alert.path
                  ? `
                <div class="alert-details">
                  <strong>Payload:</strong> <code>${alert.payload}</code>
                </div>`
                  : ""
              }
              ${
                alert.reasons?.length
                  ? `
                <ul class="alert-reasons">
                  ${alert.reasons.map((r) => `<li>• ${r}</li>`).join("")}
                </ul>`
                  : ""
              }
            </div>
          `,
            )
            .join("");
        } catch (err) {
          console.error("Alerts error:", err);
          alertList.innerHTML = `<div class="error">Error: ${err.message}</div>`;
        }
      }
    </script>
  </body>
</html>
