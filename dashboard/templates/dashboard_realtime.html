<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced IDS - Real-Time Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-indicator.online {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .status-indicator.offline {
            background: #ef4444;
            box-shadow: 0 0 10px #ef4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }

        .stat-card.high { border-left: 5px solid #ef4444; }
        .stat-card.medium { border-left: 5px solid #f59e0b; }
        .stat-card.low { border-left: 5px solid #3b82f6; }
        .stat-card.total { border-left: 5px solid #8b5cf6; }

        .chart-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .chart-container h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .alerts-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .alerts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .alerts-header h2 {
            color: #333;
            font-size: 1.5em;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            background: #f3f4f6;
            color: #333;
        }

        .filter-btn:hover {
            background: #e5e7eb;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .alert-item {
            padding: 20px;
            border-left: 4px solid #ddd;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #f9fafb;
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert-item:hover {
            background: #f3f4f6;
            transform: translateX(5px);
        }

        .alert-item.high { border-left-color: #ef4444; }
        .alert-item.medium { border-left-color: #f59e0b; }
        .alert-item.low { border-left-color: #3b82f6; }

        .alert-item.new {
            animation: highlight 1s ease;
        }

        @keyframes highlight {
            0%, 100% { background: #f9fafb; }
            50% { background: #fef3c7; }
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .severity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .severity-badge.high {
            background: #fee2e2;
            color: #dc2626;
        }

        .severity-badge.medium {
            background: #fef3c7;
            color: #d97706;
        }

        .severity-badge.low {
            background: #dbeafe;
            color: #2563eb;
        }

        .alert-details {
            color: #666;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .alert-details strong {
            color: #333;
        }

        .notification-permission {
            background: #fef3c7;
            border: 2px solid #f59e0b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notification-permission button {
            padding: 8px 16px;
            background: #f59e0b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .notification-permission button:hover {
            background: #d97706;
        }

        .connection-status {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .connection-status.connected {
            background: #d1fae5;
            color: #065f46;
        }

        .connection-status.disconnected {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-alerts {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .no-alerts svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        canvas {
            max-height: 300px !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🛡️ Advanced IDS Dashboard</h1>
            <p class="subtitle">
                <span class="status-indicator" id="connectionIndicator"></span>
                <span class="connection-status" id="connectionStatus">Connecting...</span>
            </p>
        </div>

        <!-- Notification Permission Banner -->
        <div class="notification-permission" id="notificationBanner" style="display: none;">
            <span>📢 Enable browser notifications to receive real-time security alerts</span>
            <button onclick="requestNotificationPermission()">Enable Notifications</button>
        </div>

        <!-- Statistics Cards -->
        <div class="stats-grid">
            <div class="stat-card total">
                <h3>Total Alerts</h3>
                <div class="value" id="totalAlerts">0</div>
            </div>
            <div class="stat-card high">
                <h3>High Severity</h3>
                <div class="value" id="highAlerts">0</div>
            </div>
            <div class="stat-card medium">
                <h3>Medium Severity</h3>
                <div class="value" id="mediumAlerts">0</div>
            </div>
            <div class="stat-card low">
                <h3>Low Severity</h3>
                <div class="value" id="lowAlerts">0</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="chart-container">
            <h2>📊 24-Hour Alert Timeline</h2>
            <canvas id="timelineChart"></canvas>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px;">
            <div class="chart-container">
                <h2>🎯 Detection Methods</h2>
                <canvas id="methodsChart"></canvas>
            </div>
            <div class="chart-container">
                <h2>🔝 Top Offending IPs</h2>
                <canvas id="ipsChart"></canvas>
            </div>
        </div>

        <!-- Live Alerts -->
        <div class="alerts-section">
            <div class="alerts-header">
                <h2>🚨 Live Alerts Feed</h2>
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterAlerts('all')">All</button>
                    <button class="filter-btn" onclick="filterAlerts('high')">High</button>
                    <button class="filter-btn" onclick="filterAlerts('medium')">Medium</button>
                    <button class="filter-btn" onclick="filterAlerts('low')">Low</button>
                </div>
            </div>
            <div id="alertsList">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading alerts...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        // Global variables
        let ws = null;
        let reconnectInterval = null;
        let currentFilter = 'all';
        let alertsData = [];
        let charts = {};

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Initializing dashboard...');
            checkNotificationPermission();
            initializeCharts();
            loadInitialData();
            connectWebSocket();
        });

        // WebSocket Connection
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            console.log('Connecting to WebSocket:', wsUrl);
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = function() {
                    console.log('WebSocket connected');
                    updateConnectionStatus(true);
                    if (reconnectInterval) {
                        clearInterval(reconnectInterval);
                        reconnectInterval = null;
                    }
                };
                
                ws.onmessage = function(event) {
                    console.log('WebSocket message received:', event.data);
                    try {
                        const data = JSON.parse(event.data);
                        handleWebSocketMessage(data);
                    } catch (e) {
                        console.error('Error parsing WebSocket message:', e);
                    }
                };
                
                ws.onerror = function(error) {
                    console.error('WebSocket error:', error);
                    updateConnectionStatus(false);
                };
                
                ws.onclose = function() {
                    console.log('WebSocket disconnected');
                    updateConnectionStatus(false);
                    // Attempt to reconnect
                    if (!reconnectInterval) {
                        reconnectInterval = setInterval(connectWebSocket, 5000);
                    }
                };
            } catch (e) {
                console.error('Error creating WebSocket:', e);
                updateConnectionStatus(false);
                // Fallback to polling if WebSocket not supported
                startPolling();
            }
        }

        // Fallback: Polling method if WebSocket fails
        function startPolling() {
            console.log('Starting polling fallback (WebSocket not available)');
            setInterval(loadInitialData, 5000); // Poll every 5 seconds
        }

        // Handle WebSocket messages
        function handleWebSocketMessage(data) {
            if (data.type === 'new_alert') {
                console.log('New alert received:', data.alert);
                addNewAlert(data.alert);
                showBrowserNotification(data.alert);
                updateStatistics();
            } else if (data.type === 'stats_update') {
                console.log('Stats update received:', data.stats);
                updateDashboard(data.stats);
            }
        }

        // Update connection status UI
        function updateConnectionStatus(connected) {
            const indicator = document.getElementById('connectionIndicator');
            const status = document.getElementById('connectionStatus');
            
            if (connected) {
                indicator.className = 'status-indicator online';
                status.className = 'connection-status connected';
                status.textContent = '🟢 Real-time Connected';
            } else {
                indicator.className = 'status-indicator offline';
                status.className = 'connection-status disconnected';
                status.textContent = '🔴 Reconnecting...';
            }
        }

        // Load initial data via API
        function loadInitialData() {
            console.log('Loading initial data...');
            
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    console.log('Stats loaded:', data);
                    updateDashboard(data);
                })
                .catch(error => {
                    console.error('Error loading stats:', error);
                });

            fetch('/api/alerts?limit=50')
                .then(response => response.json())
                .then(data => {
                    console.log('Alerts loaded:', data.alerts.length);
                    alertsData = data.alerts;
                    renderAlerts();
                })
                .catch(error => {
                    console.error('Error loading alerts:', error);
                    document.getElementById('alertsList').innerHTML = 
                        '<div class="no-alerts">⚠️ Error loading alerts</div>';
                });
        }

        // Update dashboard with new data
        function updateDashboard(stats) {
            // Update statistics cards
            document.getElementById('totalAlerts').textContent = stats.total_alerts || 0;
            document.getElementById('highAlerts').textContent = stats.severity_breakdown?.high || 0;
            document.getElementById('mediumAlerts').textContent = stats.severity_breakdown?.medium || 0;
            document.getElementById('lowAlerts').textContent = stats.severity_breakdown?.low || 0;

            // Update charts
            updateTimelineChart(stats.timeline || []);
            updateMethodsChart(stats.detection_methods || {});
            updateIpsChart(stats.top_ips || []);
        }

        // Initialize all charts
        function initializeCharts() {
            // Timeline Chart
            const timelineCtx = document.getElementById('timelineChart').getContext('2d');
            charts.timeline = new Chart(timelineCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Alerts',
                        data: [],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });

            // Methods Chart
            const methodsCtx = document.getElementById('methodsChart').getContext('2d');
            charts.methods = new Chart(methodsCtx, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#10b981', '#8b5cf6']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true
                }
            });

            // IPs Chart
            const ipsCtx = document.getElementById('ipsChart').getContext('2d');
            charts.ips = new Chart(ipsCtx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Alerts',
                        data: [],
                        backgroundColor: '#667eea'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        // Update timeline chart
        function updateTimelineChart(timeline) {
            if (!timeline || timeline.length === 0) return;
            
            const labels = timeline.map(t => t.hour);
            const data = timeline.map(t => t.count);
            
            charts.timeline.data.labels = labels;
            charts.timeline.data.datasets[0].data = data;
            charts.timeline.update();
        }

        // Update methods chart
        function updateMethodsChart(methods) {
            const labels = Object.keys(methods);
            const data = Object.values(methods);
            
            if (labels.length === 0) {
                labels.push('No Data');
                data.push(1);
            }
            
            charts.methods.data.labels = labels;
            charts.methods.data.datasets[0].data = data;
            charts.methods.update();
        }

        // Update IPs chart
        function updateIpsChart(ips) {
            if (!ips || ips.length === 0) {
                charts.ips.data.labels = ['No Data'];
                charts.ips.data.datasets[0].data = [0];
            } else {
                charts.ips.data.labels = ips.map(ip => ip.ip);
                charts.ips.data.datasets[0].data = ips.map(ip => ip.count);
            }
            charts.ips.update();
        }

        // Add new alert to the list
        function addNewAlert(alert) {
            alertsData.unshift(alert); // Add to beginning
            if (alertsData.length > 100) {
                alertsData = alertsData.slice(0, 100); // Keep only last 100
            }
            renderAlerts();
        }

        // Render alerts list
        function renderAlerts() {
            const alertsList = document.getElementById('alertsList');
            
            // Filter alerts based on current filter
            let filtered = alertsData;
            if (currentFilter !== 'all') {
                filtered = alertsData.filter(a => a.severity === currentFilter);
            }
            
            if (filtered.length === 0) {
                alertsList.innerHTML = `
                    <div class="no-alerts">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <h3>No alerts to display</h3>
                        <p>Your system is secure!</p>
                    </div>
                `;
                return;
            }
            
            alertsList.innerHTML = filtered.map((alert, index) => `
                <div class="alert-item ${alert.severity} ${index === 0 ? 'new' : ''}">
                    <div class="alert-header">
                        <span class="severity-badge ${alert.severity}">${alert.severity}</span>
                        <span style="color: #9ca3af; font-size: 0.9em;">${formatTimestamp(alert.timestamp)}</span>
                    </div>
                    <div class="alert-details">
                        <p><strong>Alert ID:</strong> ${alert.alert_id}</p>
                        <p><strong>IP Address:</strong> ${alert.ip}</p>
                        <p><strong>Path:</strong> ${alert.path}</p>
                        <p><strong>Method:</strong> ${alert.method || 'GET'}</p>
                        <p><strong>Detection:</strong> ${alert.detection_method} 
                           ${alert.confidence ? `(${(alert.confidence * 100).toFixed(1)}% confidence)` : ''}</p>
                        ${alert.reasons && alert.reasons.length > 0 ? `
                        <p><strong>Reasons:</strong></p>
                        <ul style="margin-left: 20px;">
                            ${alert.reasons.map(r => `<li>${r}</li>`).join('')}
                        </ul>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Filter alerts
        function filterAlerts(severity) {
            currentFilter = severity;
            
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderAlerts();
        }

        // Format timestamp
        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} min ago`;
            if (diffMins < 1440) return `${Math.floor(diffMins / 60)} hours ago`;
            
            return date.toLocaleString();
        }

        // Update statistics from current alerts
        function updateStatistics() {
            const stats = {
                total: alertsData.length,
                high: alertsData.filter(a => a.severity === 'high').length,
                medium: alertsData.filter(a => a.severity === 'medium').length,
                low: alertsData.filter(a => a.severity === 'low').length
            };
            
            document.getElementById('totalAlerts').textContent = stats.total;
            document.getElementById('highAlerts').textContent = stats.high;
            document.getElementById('mediumAlerts').textContent = stats.medium;
            document.getElementById('lowAlerts').textContent = stats.low;
        }

        // Browser Notifications
        function checkNotificationPermission() {
            if (!('Notification' in window)) {
                console.log('Browser does not support notifications');
                return;
            }
            
            if (Notification.permission === 'default') {
                document.getElementById('notificationBanner').style.display = 'flex';
            } else if (Notification.permission === 'granted') {
                console.log('Notifications already granted');
            }
        }

        function requestNotificationPermission() {
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    document.getElementById('notificationBanner').style.display = 'none';
                    new Notification('IDS Notifications Enabled', {
                        body: 'You will now receive real-time security alerts',
                        icon: '🛡️'
                    });
                }
            });
        }

        function showBrowserNotification(alert) {
            if (!('Notification' in window) || Notification.permission !== 'granted') {
                return;
            }
            
            const title = `🚨 ${alert.severity.toUpperCase()} Security Alert`;
            const body = `IP: ${alert.ip}\nPath: ${alert.path}\nDetection: ${alert.detection_method}`;
            
            const notification = new Notification(title, {
                body: body,
                icon: '🛡️',
                tag: alert.alert_id,
                requireInteraction: alert.severity === 'high'
            });
            
            notification.onclick = function() {
                window.focus();
                notification.close();
            };
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
